<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Recorder</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0f11;
      --surface: #161719;
      --surface2: #1e2022;
      --border: #2a2c30;
      --accent: #00b38a;
      --accent-dim: #00b38a44;
      --accent2: #e8a44a;
      --red: #e05555;
      --red-dim: #e0555533;
      --text: #e8eaed;
      --text-dim: #7a7f8a;
      --text-muted: #454952;
      --mono: 'DM Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.5rem 4rem;
    }

    /* ── Header ── */
    .header {
      width: 100%;
      max-width: 720px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2.5rem;
    }
    .logo-link { display: flex; align-items: center; }
    .logo-link img { height: 42px; }
    .title-block { text-align: right; }
    .title-block h1 {
      font-family: var(--mono);
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--text);
    }
    .title-block p {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-family: var(--mono);
      margin-top: 2px;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 720px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 1.2rem;
    }
    .card-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    /* ── Source selector ── */
    .source-row {
      display: flex;
      gap: 0.75rem;
    }
    .source-btn {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      font-family: var(--sans);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .source-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }
    .source-btn:hover:not(.active) {
      border-color: #3a3d44;
      color: var(--text);
    }
    .source-btn svg { width: 18px; height: 18px; }

    /* ── Level meter ── */
    .meter-section { }
    .meter-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.6rem;
    }
    .meter-label { font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted); }
    .meter-db {
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--accent);
      min-width: 5ch;
      text-align: right;
    }
    .meter-track {
      width: 100%;
      height: 20px;
      background: var(--surface2);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }
    .meter-bar {
      height: 100%;
      width: 0%;
      border-radius: 3px;
      transition: width 0.04s linear;
      background: linear-gradient(to right, #00b38a 0%, #00b38a 60%, #e8a44a 80%, #e05555 100%);
    }
    /* tick marks */
    .meter-ticks {
      display: flex;
      justify-content: space-between;
      padding: 3px 0 0;
    }
    .meter-ticks span {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--text-muted);
    }

    /* ── Waveform canvas ── */
    #waveCanvas {
      width: 100%;
      height: 80px;
      border-radius: 8px;
      background: var(--surface2);
      display: block;
      border: 1px solid var(--border);
    }

    /* ── Timer ── */
    .timer-row {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 0.5rem;
    }
    #timerDisplay {
      font-family: var(--mono);
      font-size: 2.8rem;
      font-weight: 300;
      color: var(--text);
      letter-spacing: 0.05em;
    }
    .rec-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--red);
      opacity: 0;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }
    .rec-dot.active {
      opacity: 1;
      animation: blink 1s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* ── Controls ── */
    .controls {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .btn {
      padding: 0.65rem 1.6rem;
      border-radius: 9px;
      border: none;
      font-family: var(--sans);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn:not(:disabled):hover { opacity: 0.88; }
    .btn:not(:disabled):active { transform: scale(0.97); }
    .btn-record { background: var(--red); color: #fff; }
    .btn-stop   { background: var(--surface2); color: var(--text); border: 1.5px solid var(--border); }
    .btn-neutral { background: var(--surface2); color: var(--text); border: 1.5px solid var(--border); }

    /* ── Playback & download ── */
    #playback {
      width: 100%;
      margin-bottom: 1rem;
      border-radius: 8px;
      outline: none;
      accent-color: var(--accent);
    }
    .download-row {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .filename-input {
      flex: 1;
      min-width: 160px;
      padding: 0.55rem 0.9rem;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .filename-input:focus { border-color: var(--accent); }
    .filename-input::placeholder { color: var(--text-muted); }
    .btn-download {
      background: var(--accent);
      color: #001a14;
      font-weight: 700;
      padding: 0.6rem 1.4rem;
      border-radius: 9px;
      border: none;
      font-family: var(--sans);
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.15s;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .btn-download:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-download:not(:disabled):hover { opacity: 0.85; }

    /* ── Status bar ── */
    #statusBar {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 1rem;
      min-height: 1.2em;
      transition: color 0.2s;
    }
    #statusBar.warn { color: var(--accent2); }
    #statusBar.err  { color: var(--red); }
    #statusBar.ok   { color: var(--accent); }

    /* ── Format badge ── */
    .format-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .format-chip {
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 0.7rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .format-chip.active {
      border-color: var(--accent2);
      color: var(--accent2);
    }

    /* ── Divider ── */
    .divider { height: 1px; background: var(--border); margin: 1.25rem 0; }

    @media (max-width: 480px) {
      #timerDisplay { font-size: 2rem; }
      .source-row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <a href="https://schmidt-education.com" class="logo-link">
      <img src="https://raw.githubusercontent.com/jmocs94/Schmidt-Education/360c0fde872bd41d319af96a3e55bc9df7df3a54/Crescendos_w_trans.png" alt="Crescendos">
    </a>
    <div class="title-block">
      <h1>STUDIO RECORDER</h1>
      <p>high-fidelity audio capture</p>
    </div>
  </div>

  <!-- Source -->
  <div class="card">
    <div class="card-label">Input Source</div>
    <div class="source-row">
      <button class="source-btn active" id="btnMic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        Microphone
      </button>
      <button class="source-btn" id="btnDesk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        Desktop Audio
      </button>
    </div>
  </div>

  <!-- Level meter -->
  <div class="card" id="meterCard">
    <div class="meter-header">
      <div class="meter-label">Input Level  <span id="statusBar">Initializing mic…</span></div>
      <div class="meter-db" id="dbReadout">— dBFS</div>
    </div>
    <div class="meter-track">
      <div class="meter-bar" id="meterBar"></div>
    </div>
    <div class="meter-ticks">
      <span>−∞</span><span>−48</span><span>−36</span><span>−24</span><span>−18</span><span>−12</span><span>−6</span><span>0</span>
    </div>
  </div>

  <!-- Record controls -->
  <div class="card">
    <div class="card-label">Transport</div>
    <div class="timer-row">
      <div class="rec-dot" id="recDot"></div>
      <div id="timerDisplay">00:00:00</div>
    </div>
    <div class="controls">
      <button class="btn btn-record" id="startBtn">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><circle cx="7" cy="7" r="7"/></svg>
        Record
      </button>
      <button class="btn btn-stop" id="stopBtn" disabled>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="1" y="1" width="12" height="12" rx="2"/></svg>
        Stop
      </button>
    </div>
  </div>

  <!-- Waveform -->
  <div class="card">
    <div class="card-label">Waveform Preview</div>
    <canvas id="waveCanvas"></canvas>
  </div>

  <!-- Playback & download -->
  <div class="card">
    <div class="card-label">Playback</div>
    <audio id="playback" controls></audio>
    <div class="divider"></div>
    <div class="card-label">Export</div>
    <div class="download-row">
      <input class="filename-input" type="text" id="filenameInput" placeholder="recording-filename" />
      <button class="btn-download" id="downloadBtn" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download .webm
      </button>
    </div>
  </div>

<script>
  // ── Elements ──────────────────────────────────────────────
  const btnMic      = document.getElementById('btnMic');
  const btnDesk     = document.getElementById('btnDesk');
  const startBtn    = document.getElementById('startBtn');
  const stopBtn     = document.getElementById('stopBtn');
  const recDot      = document.getElementById('recDot');
  const timerEl     = document.getElementById('timerDisplay');
  const meterBar    = document.getElementById('meterBar');
  const dbReadout   = document.getElementById('dbReadout');
  const statusEl    = document.getElementById('statusBar');
  const waveCanvas  = document.getElementById('waveCanvas');
  const playback    = document.getElementById('playback');
  const filenameInput = document.getElementById('filenameInput');
  const downloadBtn = document.getElementById('downloadBtn');

  const wCtx = waveCanvas.getContext('2d');

  // ── State ─────────────────────────────────────────────────
  let source = 'mic';   // 'mic' | 'desktop'
  let mediaRecorder;
  let chunks = [];
  let timerInterval;
  let elapsedSec = 0;
  let audioCtx, analyser, sourceNode, monitorStream;
  let meterRafId, waveRafId;
  let wavePoints = [];
  let blobUrl = null;

  // ── Source switcher ───────────────────────────────────────
  btnMic.addEventListener('click', () => {
    if (source === 'mic') return;
    source = 'mic';
    btnMic.classList.add('active');
    btnDesk.classList.remove('active');
    stopMonitor();
    initMicMonitor();
  });
  btnDesk.addEventListener('click', () => {
    if (source === 'desktop') return;
    source = 'desktop';
    btnDesk.classList.add('active');
    btnMic.classList.remove('active');
    stopMonitor();
    setStatus('Click Record to capture desktop audio.', 'warn');
    resetMeter();
  });

  // ── Helpers ───────────────────────────────────────────────
  function setStatus(msg, cls = '') {
    statusEl.textContent = msg;
    statusEl.className = cls;
  }
  function resetMeter() {
    meterBar.style.width = '0%';
    dbReadout.textContent = '— dBFS';
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function formatTime(s) {
    return `${pad(Math.floor(s/3600))}:${pad(Math.floor((s%3600)/60))}:${pad(s%60)}`;
  }
  function getDateStamp() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  // ── Resize waveCanvas ─────────────────────────────────────
  function resizeWave() {
    waveCanvas.width  = waveCanvas.offsetWidth  * devicePixelRatio;
    waveCanvas.height = waveCanvas.offsetHeight * devicePixelRatio;
  }
  window.addEventListener('resize', resizeWave);
  resizeWave();

  // ── Analyser ──────────────────────────────────────────────
  function buildAnalyser(stream) {
    if (audioCtx) { try { audioCtx.close(); } catch(e){} }
    audioCtx = new AudioContext();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.7;
    sourceNode = audioCtx.createMediaStreamSource(stream);
    sourceNode.connect(analyser);
  }

  function dbFromFloat(v) {
    if (v === 0) return -Infinity;
    return 20 * Math.log10(v);
  }

  // ── Level meter loop ──────────────────────────────────────
  function startMeterLoop() {
    const buf = new Float32Array(analyser.fftSize);
    function tick() {
      analyser.getFloatTimeDomainData(buf);
      let peak = 0;
      for (let i = 0; i < buf.length; i++) {
        const v = Math.abs(buf[i]);
        if (v > peak) peak = v;
      }
      const db = dbFromFloat(peak);
      // map -60dBFS..0dBFS → 0%..100%
      const pct = Math.max(0, Math.min(100, ((db + 60) / 60) * 100));
      meterBar.style.width = pct + '%';
      dbReadout.textContent = isFinite(db) ? db.toFixed(1) + ' dBFS' : '−∞ dBFS';
      meterRafId = requestAnimationFrame(tick);
    }
    tick();
  }

  // ── Waveform loop ─────────────────────────────────────────
  function startWaveLoop() {
    const buf = new Float32Array(analyser.fftSize);
    const W = () => waveCanvas.width;
    const H = () => waveCanvas.height;
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#00b38a';

    function tick() {
      analyser.getFloatTimeDomainData(buf);
      wCtx.clearRect(0, 0, W(), H());

      // scroll waveform
      if (wavePoints.length > W()) wavePoints.shift();
      // RMS of current frame
      let sum = 0;
      for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
      const rms = Math.sqrt(sum / buf.length);
      wavePoints.push(rms);

      // draw
      wCtx.beginPath();
      wCtx.strokeStyle = '#00b38a';
      wCtx.lineWidth = 1.5 * devicePixelRatio;
      const step = W() / Math.max(wavePoints.length, 1);
      for (let i = 0; i < wavePoints.length; i++) {
        const x = i * step;
        const amp = wavePoints[i] * H() * 2.2;
        const y1 = H() / 2 - amp;
        const y2 = H() / 2 + amp;
        if (i === 0) { wCtx.moveTo(x, y1); } else { wCtx.lineTo(x, y1); }
      }
      // mirror bottom
      for (let i = wavePoints.length - 1; i >= 0; i--) {
        const x = i * step;
        const amp = wavePoints[i] * H() * 2.2;
        wCtx.lineTo(x, H() / 2 + amp);
      }
      wCtx.closePath();
      wCtx.fillStyle = 'rgba(0,179,138,0.18)';
      wCtx.fill();
      wCtx.stroke();

      waveRafId = requestAnimationFrame(tick);
    }
    tick();
  }

  // ── Monitor mic on load ───────────────────────────────────
  async function initMicMonitor() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 2 },
        video: false
      });
      monitorStream = stream;
      buildAnalyser(stream);
      startMeterLoop();
      startWaveLoop();
      setStatus('Mic live — adjust your gain before recording.', 'ok');
    } catch(e) {
      setStatus('Mic access denied — check browser permissions.', 'err');
      console.error(e);
    }
  }

  function stopMonitor() {
    cancelAnimationFrame(meterRafId);
    cancelAnimationFrame(waveRafId);
    if (monitorStream) { monitorStream.getTracks().forEach(t => t.stop()); monitorStream = null; }
    if (audioCtx)      { try { audioCtx.close(); } catch(e){} audioCtx = null; }
    wavePoints = [];
    wCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
    resetMeter();
  }

  // ── Record ────────────────────────────────────────────────
  startBtn.addEventListener('click', async () => {
    if (source === 'mic') {
      await recordMic();
    } else {
      await recordDesktop();
    }
  });

  async function recordMic() {
    try {
      // Re-get a fresh stream for recording (monitor may be using another)
      const recStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 2 },
        video: false
      });
      // Rebuild analyser on recStream for live meter while recording
      stopMonitor();
      buildAnalyser(recStream);
      startMeterLoop();
      startWaveLoop();
      monitorStream = recStream;
      beginRecording(recStream);
      setStatus('Recording microphone…', 'ok');
    } catch(e) {
      setStatus('Could not access microphone.', 'err');
    }
  }

  async function recordDesktop() {
    try {
      const desktopStream = await navigator.mediaDevices.getDisplayMedia({ video: false, audio: true });
      const audioTracks = desktopStream.getAudioTracks();
      if (!audioTracks.length) {
        setStatus('No audio track found — make sure to share system audio.', 'err');
        desktopStream.getTracks().forEach(t => t.stop());
        return;
      }
      // Build analyser from desktop audio
      stopMonitor();
      const audioOnly = new MediaStream(audioTracks);
      monitorStream = desktopStream; // so we can stop all tracks
      buildAnalyser(audioOnly);
      startMeterLoop();
      startWaveLoop();
      beginRecording(audioOnly);
      setStatus('Recording desktop audio…', 'ok');
    } catch(e) {
      setStatus('Desktop capture cancelled or denied.', 'err');
    }
  }

  function beginRecording(stream) {
    chunks = [];
    // Prefer opus/webm for high quality, fall back gracefully
    const mimeType = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', '']
      .find(t => !t || MediaRecorder.isTypeSupported(t));
    const opts = mimeType ? { mimeType } : {};

    mediaRecorder = new MediaRecorder(stream, opts);
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = onRecordStop;
    mediaRecorder.start(250); // 250ms chunks

    // UI
    startBtn.disabled = true;
    stopBtn.disabled  = false;
    btnMic.disabled   = true;
    btnDesk.disabled  = true;
    recDot.classList.add('active');

    elapsedSec = 0;
    timerEl.textContent = formatTime(0);
    timerInterval = setInterval(() => {
      elapsedSec++;
      timerEl.textContent = formatTime(elapsedSec);
    }, 1000);
  }

  function onRecordStop() {
    const blob = new Blob(chunks, { type: 'audio/webm' });
    if (blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl = URL.createObjectURL(blob);
    playback.src = blobUrl;
    downloadBtn.disabled = false;

    downloadBtn.onclick = () => {
      const name = filenameInput.value.trim() || `Recording_${getDateStamp()}`;
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = name + '.webm';
      a.click();
    };

    setStatus(`Done — ${formatTime(elapsedSec)} recorded. Ready to play or download.`, 'ok');
  }

  stopBtn.addEventListener('click', () => {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    clearInterval(timerInterval);
    recDot.classList.remove('active');
    stopBtn.disabled  = true;
    startBtn.disabled = false;
    btnMic.disabled   = false;
    btnDesk.disabled  = false;

    // Restart live monitor if on mic source
    if (source === 'mic') {
      stopMonitor();
      initMicMonitor();
    } else {
      stopMonitor();
      setStatus('Recording stopped. Switch to mic to monitor input.', '');
    }
  });

  // ── Init ──────────────────────────────────────────────────
  initMicMonitor();
</script>
</body>
</html>
