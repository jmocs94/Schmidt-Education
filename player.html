<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Crescendos 25-26 — Playlist Player</title>
<style>
  :root {
    --teal: #00796b;
    --teal-dark: #004d40;
    --bg: #f0f8ff;
    --ink: #333;
    --panel: #ffffff;
    --muted: #e7eef6;
  }
  body {
    font-family: Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 1.75rem;
  }
  header {
    text-align: center;
    margin-bottom: 1rem;
  }
  header h1 {
    color: var(--teal);
    margin: .25rem 0;
  }
  .app {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  .card {
    background: var(--panel);
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .08);
    padding: 1rem;
  }
  h2 {
    margin: .25rem 0 .75rem 0;
    font-size: 1.1rem;
    color: var(--teal);
  }
  .library-list, .playlist {
    list-style: none;
    padding: 0;
    margin: 0;
    max-height: 380px;
    overflow: auto;
    border: 1px solid #d4dde7;
    border-radius: 10px;
    background: #fff;
  }
  .library-item, .playlist-item {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .6rem .8rem;
    border-bottom: 1px solid #eef3f9;
  }
  .title {
    flex: 1;
  }
  .btn {
    appearance: none;
    border: none;
    cursor: pointer;
    padding: .5rem .8rem;
    border-radius: 8px;
    background: var(--teal);
    color: #fff;
    font-weight: 600;
  }
  .btn:hover { background: var(--teal-dark); }
  .btn-muted {
    background: #d7e6ee;
    color: #234;
  }
  .controls {
    display: flex;
    gap: .5rem;
    flex-wrap: wrap;
    align-items: center;
    padding: .5rem;
    background: var(--muted);
    border-radius: 10px;
  }
  canvas {
    width: 100%;
    height: 100px;
    border-radius: 10px;
    margin-top: .5rem;
    background: #fff;
  }
  .scrub-handle {
    fill: rgba(255, 255, 255, 0.3);
    stroke: #fff;
    stroke-width: 2;
  }
  .fallback-bar {
    width: 100%;
    height: 10px;
    background: #ddd;
    border-radius: 5px;
    margin-top: .5rem;
  }
  .fallback-progress {
    height: 10px;
    background: var(--teal);
    border-radius: 5px;
    width: 0%;
  }
</style>
</head>
<body>
<header>
  <img src="https://raw.githubusercontent.com/jmocs94/Schmidt-Education/360c0fde872bd41d319af96a3e55bc9df7df3a54/Crescendos_w_trans.png" width="160" alt="Crescendos">
  <h1>Crescendos 25-26 — Playlist Player</h1>
  <p>Create your playlist, then control playback. Use headphones for clean audio.</p>
</header>
<div class="controls">
  <button id="playPause" class="btn">▶️ Play</button>
  <button id="stop" class="btn-muted">⏹ Stop</button>
  <button id="prev" class="btn">⏮ Prev</button>
  <button id="next" class="btn">⏭ Next</button>
  <label>Speed <select id="rate"><option>0.75×</option><option>1.0×</option><option>1.25×</option></select></label>
</div>
<canvas id="waveCanvas"></canvas>
<div class="fallback-bar"><div class="fallback-progress" id="progress"></div></div>
<p id="status">Waveform: loading...</p>
<audio id="audio" crossorigin="anonymous"></audio>
<script>
const audio=document.getElementById('audio');
const canvas=document.getElementById('waveCanvas');
const ctx=canvas.getContext('2d');
const progressBar=document.getElementById('progress');
const status=document.getElementById('status');
const playBtn=document.getElementById('playPause');
const stopBtn=document.getElementById('stop');
const rate=document.getElementById('rate');
let waveformData=[],dragging=false,audioBuffer=null;

function drawWaveform(progress=0){
  const w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h);
  const mid=h/2;
  const step=Math.ceil(waveformData.length/w);
  const barW=w/waveformData.length*step;
  for(let i=0;i<waveformData.length;i+=step){
    const x=(i/step)*barW;
    const amp=waveformData[i]*mid;
    ctx.strokeStyle=(i/waveformData.length)<progress?'#00796b':'#ccc';
    ctx.beginPath();
    ctx.moveTo(x,mid-amp);
    ctx.lineTo(x,mid+amp);
    ctx.stroke();
  }
  const handleX=progress*w;
  ctx.beginPath();
  ctx.arc(handleX,mid,7,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.fill();
  ctx.strokeStyle='#fff';
  ctx.lineWidth=2;
  ctx.stroke();
}

function fallbackProgress(){
  const pct=(audio.currentTime/audio.duration)*100;
  progressBar.style.width=pct+'%';
}

async function loadTrack(url){
  status.textContent='Waveform: loading...';
  try{
    const res=await fetch(url);
    const arr=await res.arrayBuffer();
    const ctxAudio=new AudioContext();
    audioBuffer=await ctxAudio.decodeAudioData(arr);
    waveformData=[];
    const raw=audioBuffer.getChannelData(0);
    const samples=1000;
    const block=Math.floor(raw.length/samples);
    for(let i=0;i<samples;i++){
      let sum=0;
      for(let j=0;j<block;j++)sum+=Math.abs(raw[i*block+j]);
      waveformData.push(sum/block);
    }
    drawWaveform();
    status.textContent='Waveform: ready';
  }catch(e){
    status.textContent='Waveform unavailable';
  }
}

canvas.addEventListener('mousedown',e=>{
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left;
  const progress=x/canvas.width;
  audio.currentTime=progress*audio.duration;
  drawWaveform(progress);
  dragging=true;
});
window.addEventListener('mouseup',()=>dragging=false);
window.addEventListener('mousemove',e=>{
  if(!dragging)return;
  const rect=canvas.getBoundingClientRect();
  const x=Math.max(0,Math.min(e.clientX-rect.left,canvas.width));
  const progress=x/canvas.width;
  audio.currentTime=progress*audio.duration;
  drawWaveform(progress);
});

audio.addEventListener('timeupdate',()=>{
  if(!audio.duration)return;
  const progress=audio.currentTime/audio.duration;
  drawWaveform(progress);
  fallbackProgress();
});

playBtn.onclick=()=>{
  if(audio.paused){audio.play();playBtn.textContent='⏸ Pause';}
  else{audio.pause();playBtn.textContent='▶️ Play';}
};
stopBtn.onclick=()=>{audio.pause();audio.currentTime=0;playBtn.textContent='▶️ Play';drawWaveform(0);};
rate.onchange=()=>{audio.playbackRate=parseFloat(rate.value);};

window.addEventListener('resize',()=>drawWaveform(audio.currentTime/audio.duration));

// Example Crescendos track
const defaultUrl='https://raw.githubusercontent.com/jmocs94/Schmidt-Education/d6ffc2f4207c4d7dfc207c8d49da8863c02fe413/Crescendos%2025-26/01%20Seize%20the%20Day%20-%20Performance.mp3';
audio.src=defaultUrl;
loadTrack(defaultUrl);
</script>
</body>
</html>
